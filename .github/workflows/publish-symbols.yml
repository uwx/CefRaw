name: Publish CEF Symbols

on:
  schedule:
    # Daily at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Specific platform to build (leave empty for all)'
        required: false
        type: string

permissions:
  id-token: write   # Required for NuGet Trusted Publishing (OIDC)
  packages: write    # Required for GitHub Packages
  contents: read

jobs:
  publish-symbols:
    name: ${{ matrix.platform }} symbols
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows64
          - windows32
          - windowsarm64
          - linux64
          - linux32
          - linuxarm64
          - linuxarm
          - macosx64
          - macosarm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CefRaw/global.json

      - name: Fetch CEF build index
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1
          $index = Get-CefBuildIndex

          # Get both debug and release symbols
          $debugBuild = Get-LatestBuild -Platform "${{ matrix.platform }}" -FileType debug_symbols -Index $index
          $releaseBuild = Get-LatestBuild -Platform "${{ matrix.platform }}" -FileType release_symbols -Index $index

          if (-not $debugBuild -and -not $releaseBuild) {
            Write-Warning "No debug or release symbols found for ${{ matrix.platform }} — skipping."
            "SKIP=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }

          if ($debugBuild) {
            Write-Host "Latest ${{ matrix.platform }} debug symbols: $($debugBuild.Name)"
            "BUILD_FILE_DEBUG=$($debugBuild.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          if ($releaseBuild) {
            Write-Host "Latest ${{ matrix.platform }} release symbols: $($releaseBuild.Name)"
            "BUILD_FILE_RELEASE=$($releaseBuild.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          # Use CEF version from whichever build we found
          $cver = if ($debugBuild) { $debugBuild.CefVersion } else { $releaseBuild.CefVersion }
          "CEF_VERSION=$cver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SKIP=false" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download and extract symbols
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1

          $workDir = Join-Path $env:RUNNER_TEMP "cef-symbols"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null

          # Download both debug and release symbols archives
          $extractedDirs = @()
          if ($env:BUILD_FILE_DEBUG) {
            Write-Host "Downloading debug symbols: $env:BUILD_FILE_DEBUG"
            $extractedDirs += Expand-CefArchive -FileName $env:BUILD_FILE_DEBUG -OutputDirectory (Join-Path $workDir "debug")
          }
          if ($env:BUILD_FILE_RELEASE) {
            Write-Host "Downloading release symbols: $env:BUILD_FILE_RELEASE"
            $extractedDirs += Expand-CefArchive -FileName $env:BUILD_FILE_RELEASE -OutputDirectory (Join-Path $workDir "release")
          }

          # Merge all extracted files into a single directory for packaging
          $mergedDir = Join-Path $workDir "merged"
          New-Item -ItemType Directory -Path $mergedDir -Force | Out-Null
          foreach ($d in $extractedDirs) {
            Copy-Item -Recurse -Force "$d\*" $mergedDir
          }

          Write-Host "Merged symbols to: $mergedDir"
          "EXTRACTED_DIR=$mergedDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate symbols project
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1

          $outputDir = Join-Path $env:RUNNER_TEMP "projects"
          $project = New-CefBinariesProject `
            -Platform "${{ matrix.platform }}" `
            -Configuration "Release" `
            -CefVersion $env:CEF_VERSION `
            -ExtractedDir $env:EXTRACTED_DIR `
            -OutputDir $outputDir `
            -IsSymbols

          "PROJECT_DIR=$($project.ProjectDir)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_ID=$($project.PackageId)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Pack NuGet package
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          $nupkgDir = Join-Path $env:RUNNER_TEMP "nupkgs"
          New-Item -ItemType Directory -Path $nupkgDir -Force | Out-Null

          dotnet pack $env:PROJECT_DIR `
            --configuration Release `
            --output $nupkgDir `
            /p:Version=$env:CEF_VERSION

          "NUPKG_DIR=$nupkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          Get-ChildItem $nupkgDir -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Package: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }

      - name: Upload symbol package artifact
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-symbols
          path: ${{ env.NUPKG_DIR }}/*.nupkg
          retention-days: 7

      - name: NuGet login (OIDC → temp API key)
        if: env.SKIP != 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          Get-ChildItem $env:NUPKG_DIR -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.Name) to nuget.org..."
            dotnet nuget push $_.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json
          }

      - name: Push to GitHub Packages
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          Get-ChildItem $env:NUPKG_DIR -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.Name) to GitHub Packages..."
            dotnet nuget push $_.FullName `
              --api-key ${{ github.token }} `
              --source https://nuget.pkg.github.com/uwx/index.json
          }
