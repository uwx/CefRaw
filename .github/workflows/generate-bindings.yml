name: Generate CEF Bindings

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 8:00 AM UTC (after natives publish at 6 AM)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write   # Required for committing and pushing generated code
  id-token: write   # Required for NuGet Trusted Publishing (OIDC)
  packages: write   # Required for GitHub Packages

jobs:
  generate:
    name: Generate bindings from CEF headers
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CefRaw/global.json

      - name: Install ClangSharpPInvokeGenerator
        shell: pwsh
        run: |
          dotnet tool install --global ClangSharpPInvokeGenerator --prerelease
          # Add .NET tools to PATH
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Fetch CEF build index
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1
          $index = Get-CefBuildIndex

          $platforms = @("windows64", "linux64", "macosarm64")
          $cefVersion = $null
          foreach ($p in $platforms) {
            $build = Get-LatestBuild -Platform $p -FileType standard -Index $index
            if (-not $build) {
              Write-Error "No standard build found for $p"
              exit 1
            }
            Write-Host "$p latest: $($build.Name) (v$($build.CefVersion))"
            "BUILD_FILE_$p=$($build.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
            if (-not $cefVersion) { $cefVersion = $build.CefVersion }
          }
          # Export for subsequent steps
          $revision = (Get-Date -Format 'yyyyMMddHHmmss')
          "CEF_VERSION_CLEAN=$cefVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEF_VERSION=$cefVersion.$revision" | Out-File -FilePath $env:GITHUB_ENV -Append
          "NUGET_VERSION=0.0.1-cef.$cefVersion-ci.$revision" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "CEF version for commit: $cefVersion"
          Write-Host "NuGet version: 0.0.1-cef.$cefVersion-ci.$revision"

      - name: Create merged include directory
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1

          $workDir = Join-Path $env:RUNNER_TEMP "cef-headers"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null

          # Download and extract headers from each platform
          $platforms = @("windows64", "linux64", "macosarm64")
          $extractedDirs = @{}

          foreach ($p in $platforms) {
            $envVarName = "BUILD_FILE_$p"
            $fileName = [Environment]::GetEnvironmentVariable($envVarName)
            if (-not $fileName) {
              Write-Error "BUILD_FILE_$p environment variable not set"
              exit 1
            }
            Write-Host "Downloading ${p}: $fileName"
            $extracted = Expand-CefArchive -FileName $fileName -OutputDirectory (Join-Path $workDir $p)
            $extractedDirs[$p] = $extracted
          }

          # Flat-merge: windows64 first (base), then linux64 overlay, then macosarm64 overlay
          $mergedDir = Join-Path $workDir "include-merged"
          if (Test-Path $mergedDir) {
            Remove-Item -Recurse -Force $mergedDir
          }
          New-Item -ItemType Directory -Path $mergedDir -Force | Out-Null

          foreach ($p in $platforms) {
            $srcInclude = Join-Path $extractedDirs[$p] "include"
            if (-not (Test-Path $srcInclude)) {
              Write-Error "include/ not found in $p build at $srcInclude"
              exit 1
            }
            Write-Host "Merging include/ from $p..."
            # Walk items individually so we can resolve file↔directory conflicts
            # (one platform may have a file where another has a directory).
            $srcLen = $srcInclude.Length + 1
            Get-ChildItem -Recurse -Path $srcInclude | ForEach-Object {
              $relPath = $_.FullName.Substring($srcLen)
              $target = Join-Path $mergedDir $relPath
              if ($_.PSIsContainer) {
                if (Test-Path $target -PathType Leaf) { Remove-Item -Force $target }
                if (-not (Test-Path $target)) { New-Item -ItemType Directory -Path $target -Force | Out-Null }
              } else {
                if (Test-Path $target -PathType Container) { Remove-Item -Recurse -Force $target }
                Copy-Item -Force $_.FullName $target
              }
            }
          }

          # Copy merged include to repo (item-by-item to handle any conflicts)
          $repoInclude = Join-Path $env:GITHUB_WORKSPACE "include"
          if (Test-Path $repoInclude) {
            Remove-Item -Recurse -Force $repoInclude
          }
          # Use the same conflict-safe walk for the final copy
          $mergedLen = $mergedDir.Length + 1
          Get-ChildItem -Recurse -Path $mergedDir | ForEach-Object {
            $relPath = $_.FullName.Substring($mergedLen)
            $target = Join-Path $repoInclude $relPath
            if ($_.PSIsContainer) {
              if (Test-Path $target -PathType Leaf) { Remove-Item -Force $target }
              if (-not (Test-Path $target)) { New-Item -ItemType Directory -Path $target -Force | Out-Null }
            } else {
              if (Test-Path $target -PathType Container) { Remove-Item -Recurse -Force $target }
              Copy-Item -Force $_.FullName $target
            }
          }
          Write-Host "Merged $(@(Get-ChildItem -Recurse -File $repoInclude).Count) header files to include/"

      - name: Run generate.ps1
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Running ClangSharpPInvokeGenerator..."
          ./generate.ps1
          # ClangSharpPInvokeGenerator often exits non-zero for non-critical
          # warnings — the XML output is still valid. Continue regardless.
          Write-Host "generate.ps1 finished (exit code: $LASTEXITCODE, ignored)"
          Write-Host "Generated bindings XML files:"
          Get-ChildItem bindings_*.xml | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - name: Build BindingsParser
        shell: pwsh
        run: |
          dotnet build CefRaw/CefRaw.BindingsParser/CefRaw.BindingsParser.csproj --configuration Release

      - name: Run RawCef.Generator
        shell: pwsh
        run: |
          Write-Host "Running RawCef.Generator..."
          dotnet run --project CefRaw/RawCef.Generator/RawCef.Generator.csproj --configuration Release -- CefRaw/RawCef
          if ($LASTEXITCODE -ne 0) {
            Write-Error "RawCef.Generator failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "Generator completed successfully"

      - name: Download win64 Debug binaries for tests
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1

          $workDir = Join-Path $env:RUNNER_TEMP "cef-win64-test"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null

          $fileName = [Environment]::GetEnvironmentVariable("BUILD_FILE_windows64")
          if (-not $fileName) {
            Write-Error "BUILD_FILE_windows64 not set"
            exit 1
          }

          Write-Host "Downloading $fileName for test binaries..."
          $extracted = Expand-CefArchive -FileName $fileName -OutputDirectory $workDir

          # Copy Debug binaries into the binaries project directory
          $binariesDir = Join-Path $env:GITHUB_WORKSPACE "CefRaw\RawCef.Binaries.Win64.Debug"
          $debugSrc = Join-Path $extracted "Debug"
          $resourcesSrc = Join-Path $extracted "Resources"

          # Copy Debug/* to binaries dir
          Copy-Item -Force "$debugSrc\*" $binariesDir
          Write-Host "Copied Debug binaries to $binariesDir"

          # Copy Resources/ contents
          if (Test-Path "$binariesDir\Resources") {
            Remove-Item -Recurse -Force "$binariesDir\Resources"
          }
          Copy-Item -Recurse -Force $resourcesSrc "$binariesDir\Resources"
          Write-Host "Copied Resources to $binariesDir\Resources"

      - name: Build solution
        shell: pwsh
        run: |
          dotnet build CefRaw/CefRaw.sln --configuration Release

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test CefRaw/RawCef.Tests/RawCef.Tests.csproj --configuration Release --no-build

      - name: Pack RawCef NuGet packages
        shell: pwsh
        run: |
          $nupkgDir = Join-Path $env:RUNNER_TEMP "nupkgs-rawcef"
          New-Item -ItemType Directory -Path $nupkgDir -Force | Out-Null

          $csprojs = @(
            "CefRaw/RawCef/RawCef.Windows.csproj",
            "CefRaw/RawCef/RawCef.Mac.csproj",
            "CefRaw/RawCef/RawCef.Linux.csproj"
          )

          foreach ($csproj in $csprojs) {
            Write-Host "Packing $csproj..."
            dotnet pack $csproj `
              --configuration Release `
              --no-build `
              --output $nupkgDir `
              /p:PackageVersion=$env:NUGET_VERSION
          }

          "NUPKG_DIR=$nupkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          Get-ChildItem $nupkgDir -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Package: $($_.Name) ($([math]::Round($_.Length / 1KB, 1)) KB)"
          }

      - name: Upload RawCef artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rawcef-bindings
          path: ${{ env.NUPKG_DIR }}/*.nupkg
          retention-days: 7

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push RawCef to nuget.org
        shell: pwsh
        run: |
          Get-ChildItem $env:NUPKG_DIR -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.Name) to nuget.org..."
            dotnet nuget push $_.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }

      - name: Push RawCef to GitHub Packages
        shell: pwsh
        run: |
          Get-ChildItem $env:NUPKG_DIR -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.Name) to GitHub Packages..."
            dotnet nuget push $_.FullName `
              --api-key ${{ github.token }} `
              --source https://nuget.pkg.github.com/uwx/index.json `
              --skip-duplicate
          }

      - name: Check for changes
        id: git-check
        shell: pwsh
        run: |
          git add include/ bindings_*.xml CefRaw/RawCef/Native/ CefRaw/RawCef/Managed/ CefRaw/RawCef/Enums/ CefRaw/RawCef/*.g.cs

          $hasChanges = git status --porcelain
          if ($hasChanges) {
            Write-Host "Changes detected, will commit"
            "HAS_CHANGES=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "No changes detected"
            "HAS_CHANGES=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Commit and push changes
        if: steps.git-check.outputs.HAS_CHANGES == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: regenerate bindings for CEF $env:CEF_VERSION_CLEAN"
          git push origin HEAD:main
          Write-Host "Changes committed and pushed for CEF $env:CEF_VERSION_CLEAN"
