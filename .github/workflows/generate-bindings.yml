name: Generate CEF Bindings

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 8:00 AM UTC (after natives publish at 6 AM)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write   # Required for committing and pushing generated code
  id-token: write   # Required for NuGet Trusted Publishing (OIDC)
  packages: write   # Required for GitHub Packages

jobs:
  # ── Job 1: Generate bindings & commit ──────────────────────────────
  generate:
    name: Generate & commit
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CefRaw/global.json

      - name: Install ClangSharpPInvokeGenerator
        shell: pwsh
        run: |
          dotnet tool install --global ClangSharpPInvokeGenerator --prerelease
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Fetch CEF build index
        id: fetch-index
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1
          $index = Get-CefBuildIndex

          $platforms = @("windows64", "linux64", "macosarm64")
          $cefVersion = $null
          foreach ($p in $platforms) {
            $build = Get-LatestBuild -Platform $p -FileType standard -Index $index
            if (-not $build) { Write-Error "No standard build found for $p"; exit 1 }
            Write-Host "$p latest: $($build.Name) (v$($build.CefVersion))"
            "BUILD_FILE_$p=$($build.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
            if (-not $cefVersion) { $cefVersion = $build.CefVersion }
          }
          "CEF_VERSION_CLEAN=$cefVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create merged include directory
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1

          $workDir = Join-Path $env:RUNNER_TEMP "cef-headers"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null

          $platforms = @("windows64", "linux64", "macosarm64")
          $extractedDirs = @{}
          foreach ($p in $platforms) {
            $fileName = [Environment]::GetEnvironmentVariable("BUILD_FILE_$p")
            if (-not $fileName) { Write-Error "BUILD_FILE_$p not set"; exit 1 }
            $extracted = Expand-CefArchive -FileName $fileName -OutputDirectory (Join-Path $workDir $p)
            $extractedDirs[$p] = $extracted
          }

          $mergedDir = Join-Path $workDir "include-merged"
          if (Test-Path $mergedDir) { Remove-Item -Recurse -Force $mergedDir }
          New-Item -ItemType Directory -Path $mergedDir -Force | Out-Null

          foreach ($p in $platforms) {
            $srcInclude = Join-Path $extractedDirs[$p] "include"
            if (-not (Test-Path $srcInclude)) { Write-Error "include/ not found in $p"; exit 1 }
            Write-Host "Merging include/ from $p..."
            $srcLen = $srcInclude.Length + 1
            Get-ChildItem -Recurse -Path $srcInclude | ForEach-Object {
              $relPath = $_.FullName.Substring($srcLen)
              $target = Join-Path $mergedDir $relPath
              if ($_.PSIsContainer) {
                if (Test-Path $target -PathType Leaf) { Remove-Item -Force $target }
                if (-not (Test-Path $target)) { New-Item -ItemType Directory -Path $target -Force | Out-Null }
              } else {
                if (Test-Path $target -PathType Container) { Remove-Item -Recurse -Force $target }
                Copy-Item -Force $_.FullName $target
              }
            }
          }

          $repoInclude = Join-Path $env:GITHUB_WORKSPACE "include"
          if (Test-Path $repoInclude) { Remove-Item -Recurse -Force $repoInclude }
          $mergedLen = $mergedDir.Length + 1
          Get-ChildItem -Recurse -Path $mergedDir | ForEach-Object {
            $relPath = $_.FullName.Substring($mergedLen)
            $target = Join-Path $repoInclude $relPath
            if ($_.PSIsContainer) {
              if (Test-Path $target -PathType Leaf) { Remove-Item -Force $target }
              if (-not (Test-Path $target)) { New-Item -ItemType Directory -Path $target -Force | Out-Null }
            } else {
              if (Test-Path $target -PathType Container) { Remove-Item -Recurse -Force $target }
              Copy-Item -Force $_.FullName $target
            }
          }
          Write-Host "Merged $(@(Get-ChildItem -Recurse -File $repoInclude).Count) header files"

      - name: Run generate.ps1
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Running ClangSharpPInvokeGenerator..."
          ./generate.ps1
          $exit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Write-Host "generate.ps1 finished (exit code: $exit, ignored)"
          Get-ChildItem bindings_*.xml | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - name: Build BindingsParser
        shell: pwsh
        run: dotnet build CefRaw/CefRaw.BindingsParser/CefRaw.BindingsParser.csproj --configuration Release

      - name: Run RawCef.Generator
        shell: pwsh
        run: |
          Write-Host "Running RawCef.Generator..."
          dotnet run --project CefRaw/RawCef.Generator/RawCef.Generator.csproj --configuration Release -- CefRaw/RawCef
          if ($LASTEXITCODE -ne 0) { Write-Error "RawCef.Generator failed"; exit 1 }
          Write-Host "Generator completed"

      - name: Check for changes
        id: git-check
        shell: pwsh
        run: |
          git add include/ bindings_*.xml CefRaw/RawCef/Native/ CefRaw/RawCef/Managed/ CefRaw/RawCef/Enums/ CefRaw/RawCef/*.g.cs
          $hasChanges = git status --porcelain
          if ($hasChanges) { "HAS_CHANGES=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append }
          else             { "HAS_CHANGES=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append }

      - name: Commit and push changes
        if: steps.git-check.outputs.HAS_CHANGES == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate bindings for CEF $env:CEF_VERSION_CLEAN"
          git push origin HEAD:main
          Write-Host "Changes pushed for CEF $env:CEF_VERSION_CLEAN"

  # ── Job 2: Test on Windows ─────────────────────────────────────────
  test-windows:
    name: Test (Windows)
    needs: generate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CefRaw/global.json

      - name: Fetch & download win64 Debug binaries
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1
          $index = Get-CefBuildIndex
          $build = Get-LatestBuild -Platform "windows64" -FileType standard -Index $index
          if (-not $build) { Write-Error "No windows64 standard build found"; exit 1 }
          Write-Host "Downloading $($build.Name) for tests..."

          $workDir = Join-Path $env:RUNNER_TEMP "cef-win64"
          $extracted = Expand-CefArchive -FileName $build.Name -OutputDirectory $workDir

          $binariesDir = Join-Path $env:GITHUB_WORKSPACE "CefRaw\RawCef.Binaries.Win64.Debug"
          Copy-Item -Force (Join-Path $extracted "Debug\*") $binariesDir
          if (Test-Path "$binariesDir\Resources") { Remove-Item -Recurse -Force "$binariesDir\Resources" }
          Copy-Item -Recurse -Force (Join-Path $extracted "Resources") "$binariesDir\Resources"
          Write-Host "Copied Debug binaries to $binariesDir"

      - name: Build & test
        shell: pwsh
        run: |
          dotnet build CefRaw/CefRaw.sln --configuration Release
          dotnet test CefRaw/RawCef.Tests/RawCef.Tests.csproj --configuration Release --no-build

  # ── Job 3: Test on Linux ───────────────────────────────────────────
  test-linux:
    name: Test (Linux)
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CefRaw/global.json

      - name: Fetch & download linux64 Debug binaries
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1
          $index = Get-CefBuildIndex
          $build = Get-LatestBuild -Platform "linux64" -FileType standard -Index $index
          if (-not $build) { Write-Error "No linux64 standard build found"; exit 1 }
          Write-Host "Downloading $($build.Name) for tests..."

          $workDir = Join-Path $env:RUNNER_TEMP "cef-linux64"
          $extracted = Expand-CefArchive -FileName $build.Name -OutputDirectory $workDir

          $binariesDir = Join-Path $env:GITHUB_WORKSPACE "CefRaw\RawCef.Binaries.Linux64.Debug"
          Copy-Item -Force (Join-Path $extracted "Debug\*") $binariesDir
          if (Test-Path "$binariesDir\Resources") { Remove-Item -Recurse -Force "$binariesDir\Resources" }
          Copy-Item -Recurse -Force (Join-Path $extracted "Resources") "$binariesDir\Resources"
          Write-Host "Copied Debug binaries to $binariesDir"

      - name: Build & test (Linux)
        shell: pwsh
        run: |
          dotnet build CefRaw/CefRaw.sln --configuration Release
          dotnet test CefRaw/RawCef.Tests/RawCef.Tests.csproj --configuration Release --no-build
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CefRaw/global.json

      - name: Fetch CEF version for NuGet
        shell: pwsh
        run: |
          . ./scripts/cef-builds.ps1
          $index = Get-CefBuildIndex
          $build = Get-LatestBuild -Platform "windows64" -FileType standard -Index $index
          $cefVersion = $build.CefVersion
          $revision = (Get-Date -Format 'yyyyMMddHHmmss')
          $nugetVersion = "0.0.1-cef.$cefVersion-ci.$revision"
          Write-Host "NuGet version: $nugetVersion"
          "NUGET_VERSION=$nugetVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: dotnet build CefRaw/CefRaw.sln --configuration Release

      - name: Pack RawCef NuGet packages
        shell: pwsh
        run: |
          $nupkgDir = Join-Path $env:RUNNER_TEMP "nupkgs-rawcef"
          New-Item -ItemType Directory -Path $nupkgDir -Force | Out-Null

          $csprojs = @(
            "CefRaw/RawCef/RawCef.Windows.csproj",
            "CefRaw/RawCef/RawCef.Mac.csproj",
            "CefRaw/RawCef/RawCef.Linux.csproj"
          )
          foreach ($csproj in $csprojs) {
            Write-Host "Packing $csproj..."
            dotnet pack $csproj --configuration Release --no-build --output $nupkgDir /p:PackageVersion=$env:NUGET_VERSION
          }
          "NUPKG_DIR=$nupkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $nupkgDir -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Package: $($_.Name) ($([math]::Round($_.Length / 1KB, 1)) KB)"
          }

      - name: Upload RawCef artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rawcef-bindings
          path: ${{ env.NUPKG_DIR }}/*.nupkg
          retention-days: 7

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: pwsh
        run: |
          Get-ChildItem $env:NUPKG_DIR -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.Name) to nuget.org..."
            dotnet nuget push $_.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          Get-ChildItem $env:NUPKG_DIR -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.Name) to GitHub Packages..."
            dotnet nuget push $_.FullName --api-key ${{ github.token }} --source https://nuget.pkg.github.com/uwx/index.json --skip-duplicate
          }
